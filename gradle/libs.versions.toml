[versions]
ktor = "3.1.2"
caffeine = "3.2.0"
kotlin = "2.1.20"
ktlint = "12.2.0"
kotlinx-coroutines = "1.10.1"
kotlinx-serialization-json = "1.7.2"
kotlinx-datetime = "0.6.2"
logback = "1.5.16"
ktlint-extras = "0.2.1"

[libraries]
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }

caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

ktor-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

ktlint-extras = { module = "net.radsteve.ktlint.extras:rules", version.ref = "ktlint-extras" }

[bundles]
ktor-client = ["ktor-client-cio", "ktor-client-core", "ktor-client-content-negotiation", "ktor-serialization"]
ktor-server = ["ktor-server-cio", "ktor-server-core", "ktor-serialization"]
kotlinx = ["kotlinx-serialization-json", "kotlinx-coroutines", "kotlinx-datetime"]

[plugins]
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
kotlin = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
